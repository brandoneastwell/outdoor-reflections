[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "outdoor-reflections-ai"
version = "0.1.0"
description = "AI microservice for Outdoor Reflections"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.4",
    "groq==1.7.0",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.15.1",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_groq: makes paid network requests to the live Groq API",
]
