services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outdoor-reflections-api
    ports:
      # Mac:Container
      - "3001:3001"

    env_file:
      - .env

    environment:
      PORT: 3001
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT_MS: 15000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/outdoor_reflections_db

    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: outdoor-reflections-ai
    restart: unless-stopped

    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_MAX_INPUT_TOKENS: ${GROQ_MAX_INPUT_TOKENS:-1500}
      GROQ_MAX_COMPLETION_TOKENS: ${GROQ_MAX_COMPLETION_TOKENS:-256}
      GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-low}
      GROQ_TOKEN_LIMIT_PER_MINUTE: ${GROQ_TOKEN_LIMIT_PER_MINUTE:-6000}
      GROQ_TOKEN_LIMIT_PER_DAY: ${GROQ_TOKEN_LIMIT_PER_DAY:-150000}
      REDIS_URL: redis://redis:6379/0

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "8000:8000"

  redis:
    image: redis:8.2-alpine
    container_name: outdoor-reflections-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: outdoor_reflections_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d outdoor_reflections_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:17
    container_name: postgres-db-test
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: outdoor_reflections_test_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_test_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d outdoor_reflections_test_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_test_data:
  redis_data:
